#springboot
spring:
  profiles:
    active: prod
  mvc:
    pathmatch:
      matching-strategy: ANT_PATH_MATCHER

#webserver
server:
  port: 8080
  tomcat:
    uri-encoding: utf-8
    #最大并发数，最佳线程数目 = （（线程等待时间+线程CPU时间）/线程CPU时间 ）* CPU数目，1、CPU密集型：操作内存处理的业务，一般线程数设置为：CPU核数 + 1 或者 CPU核数*2。核数为4的话，一般设置 5 或 8 。 2、IO密集型：文件操作，网络操作，数据库操作，一般线程设置为：cpu核数 / (1-0.9)，核数为4的话，一般设置 40
    max-threads: 15
    #接受和处理的最大连接数
    max-connections: 20000
    #初始化时创建的线程数
    min-spareThreads: 20
    #可以放到处理队列中的请求数
    acceptCount: 700
  servlet:
    context-path: /
  forward-headers-strategy: framework

#management
management:
  server:
    #actuator端口
    port: -1
  endpoints:
    web:
      exposure:
        #开放所有页面节点  默认只开启了health、info两个节点
        exclude: '*'
  endpoint:
    health:
      #显示健康具体信息，默认不会显示详细信息
      show-details: always
  health:
    elasticsearch:
      #关闭elasticsearch的健康检查
      enabled: false

# 滑动验证，底图路径，不配置将使用默认图片
# 支持全路径
# 支持项目路径,以classpath:开头,取resource目录下路径,例：classpath:images/jigsaw

aj:
  captcha:
    #    jigsaw: "classpath:images/jigsaw"
    #滑动验证，底图路径，不配置将使用默认图片
    ##支持全路径
    # 支持项目路径,以classpath:开头,取resource目录下路径,例：classpath:images/pic-click
    # pic-click: "classpath:images/pic-click"
    # 缓存local/redis...
    cache-type: redis
    # blockPuzzle 滑块 clickWord 文字点选  default默认两者都实例化
    type: default
    # 汉字统一使用Unicode,保证程序通过@value读取到是中文，可通过这个在线转换;yml格式不需要转换
    # https://tool.chinaz.com/tools/unicode.aspx 中文转Unicode
    # 右下角水印文字(我的水印)
    water-mark: "\u004e\u0069\u0075\u0043\u006c\u006f\u0075\u0064"
    # 右下角水印字体(不配置时，默认使用文泉驿正黑)
    # 由于宋体等涉及到版权，我们jar中内置了开源字体【文泉驿正黑】
    # 方式一：直接配置OS层的现有的字体名称，比如：宋体
    # 方式二：自定义特定字体，请将字体放到工程resources下fonts文件夹，支持ttf\ttc\otf字体
    #water-font: WenQuanZhengHei.ttf
    # 点选文字验证码的文字字体(文泉驿正黑)
    #font-type: WenQuanZhengHei.ttf
    # 校验滑动拼图允许误差偏移量(默认5像素)
    slip-offset: 5
    # aes加密坐标开启或者禁用(true|false)
    aes-status: true
    # 滑动干扰项(0/1/2)
    interference-options: 0
    #点选字体样式 默认Font.BOLD
    font-style: 1
    #点选字体字体大小
    font-size: 25
    #点选文字个数,存在问题，暂不支持修改
    #click-word-count: 4
    history-data-clear-enable: false
    # 接口请求次数一分钟限制是否开启 true|false
    req-frequency-limit-enable: false
    # 验证失败5次，get接口锁定
    req-get-lock-limit: 5
    # 验证失败后，锁定时间间隔,s
    req-get-lock-seconds: 360
    # get接口一分钟内请求数限制
    req-get-minute-limit: 30
    # check接口一分钟内请求数限制
    req-check-minute-limit: 60
    # verify接口一分钟内请求数限制
    req-verify-minute-limit: 60


#系统基础配置
system:
  admin-token-name: token
  api-token-name: token
  admin-site-id-name: site-id
  api-site-id-name: site-id
  channel-name: channel
  admin-domain:
  wap-domain:
  web-domain:
